<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet Sentiment Analyzer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --positive-color: #22c55e;
            --negative-color: #ef4444;
            --neutral-color: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1.2fr 0.8fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1fr solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-blue);
        }

        .char-counter {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #0f172a;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .metric-card {
            background-color: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        /* Results Display */
        .ready {
            text-align: center;
            padding: 40px 10px;
            color: var(--text-muted);
        }

        .ready-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-main {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-icon {
            font-size: 2.5rem;
        }

        .result-name {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .result-description {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .positive .result-name { color: var(--positive-color); }
        .negative .result-name { color: var(--negative-color); }
        .neutral .result-name { color: var(--neutral-color); }

        .confidence {
            margin-bottom: 20px;
        }

        .confidence-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .track {
            height: 8px;
            background-color: #0f172a;
            border-radius: 4px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .positive-fill { background-color: var(--positive-color); }
        .negative-fill { background-color: var(--negative-color); }
        .neutral-fill { background-color: var(--neutral-color); }

        .prob-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .prob-row {
            margin-bottom: 10px;
        }

        .prob-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
    </style>
</head>

<div class="container">
    <!-- Input Section -->
    <div class="card">
        <div class="header">
            <h1>Tweet Sentiment Analyzer</h1>
            <p>Classify text sentiment into Positive, Negative, or Neutral.</p>
        </div>

        <div class="button-group">

        <div class="metrics-grid">

                <div class="metric-value" id="accuracyMetric">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Precision</div>
                <div class="metric-value" id="precisionMetric">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Recall</div>
                <div class="metric-value" id="recallMetric">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">F1 Score</div>
                <div class="metric-value" id="f1Metric">--</div>
            </div>
        </div>
    </div>

    <!-- Output Section -->
    <div class="card" id="result">

            <div class="ready-icon">✦</div>
            <strong>Ready to analyze</strong>
            <div style="margin-top:7px;">Enter a tweet to see the predicted sentiment.</div>
        </div>
    </div>
</div>

        resultBox.innerHTML = `
            <div class="ready">
                <div class="ready-icon">⚠️</div>
                <strong>Please enter a tweet</strong>
                <div style="margin-top:7px;">Type or paste text into the input field first.</div>
            </div>`;
        return;
    }

    // Tokenize text into words
    const words = text.match(/\b[a-z0-9']+\b/g) || [];
    
    let posScore = 0;
    let negScore = 0;

    // Count score based on sentiment dictionaries
    words.forEach(word => {
        if (POSITIVE_WORDS.includes(word)) {
            posScore += 2;
        } else if (NEGATIVE_WORDS.includes(word)) {
            negScore += 2;
        }
    });

    let predictedClass = "neutral";
    let posProb = 0.15;
    let negProb = 0.15;
    let neuProb = 0.70;

    // STRICT SENTIMENT RULES
    if (posScore > negScore && posScore >= 2) {
        predictedClass = "positive";
        posProb = Math.min(0.92, 0.60 + (posScore * 0.08));
        negProb = 0.05;
        neuProb = Number((1 - posProb - negProb).toFixed(2));
    } 
    else if (negScore > posScore && negScore >= 2) {
        predictedClass = "negative";
        negProb = Math.min(0.92, 0.60 + (negScore * 0.08));
        posProb = 0.05;
        neuProb = Number((1 - negProb - posProb).toFixed(2));
    } 
    else {
        // Strict fallback to Neutral when no explicit positive/negative words exist
        predictedClass = "neutral";
        neuProb = 0.82;
        posProb = 0.09;
        negProb = 0.09;
    }

    const confidence = Math.round(Math.max(posProb, negProb, neuProb) * 100);

    // Update Result UI
    renderResult(predictedClass, confidence, posProb, negProb, neuProb);
}

function renderResult(sentiment, confidence, posProb, negProb, neuProb) {
    const resultBox = document.getElementById("result");

    const meta = {
        positive: { icon: "😊", name: "Positive", desc: "This tweet expresses positive sentiment, joy, or approval." },
        negative: { icon: "🙁", name: "Negative", desc: "This tweet expresses negative sentiment, frustration, or disapproval." },
        neutral: { icon: "😐", name: "Neutral", desc: "This tweet is informational, objective, or neutral." }
    };

    const current = meta[sentiment];

    resultBox.innerHTML = `
        <div class="${sentiment}">
            <div class="result-label">PREDICTED SENTIMENT</div>
            <div class="result-main">
                <div class="result-icon">${current.icon}</div>
                <div>
                    <div class="result-name">${current.name}</div>
                    <div class="result-description">${current.desc}</div>
                </div>
            </div>
        </div>

        <div class="confidence">
            <div class="confidence-head">
                <span>Confidence Score</span>
                <strong>${confidence}%</strong>
            </div>
            <div class="track">
                <div class="fill ${sentiment}-fill" style="width: ${confidence}%"></div>
            </div>
        </div>

        <div class="probabilities">
            <div class="prob-title">Class Probabilities</div>
            
            <div class="prob-row">
                <div class="prob-head">
                    <span>Positive</span>
                    <span>${(posProb * 100).toFixed(1)}%</span>
                </div>
                <div class="track"><div class="fill positive-fill" style="width: ${posProb * 100}%"></div></div>
            </div>

            <div class="prob-row">
                <div class="prob-head">
                    <span>Neutral</span>
                    <span>${(neuProb * 100).toFixed(1)}%</span>
                </div>
                <div class="track"><div class="fill neutral-fill" style="width: ${neuProb * 100}%"></div></div>
            </div>

            <div class="prob-row">
                <div class="prob-head">
                    <span>Negative</span>
                    <span>${(negProb * 100).toFixed(1)}%</span>
                </div>
                <div class="track"><div class="fill negative-fill" style="width: ${negProb * 100}%"></div></div>
            </div>
        </div>
    `;
}
